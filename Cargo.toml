[workspace]
members = [".", "runtime", "bench/baseline"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
publish = false
repository = "https://github.com/Alibek10599/imanari"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
tokio = { version = "1.53", default-features = false }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }

[package]
name = "imanari"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Compiler and local runtime for the Imanari system language"
readme = "README.md"
keywords = ["language", "compiler", "codegen", "web"]
categories = ["compilers", "command-line-utilities", "development-tools"]

[[bin]]
name = "nari"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "signal", "time", "io-util", "net", "sync"] }
sqlx.workspace = true
rlimit = "0.11"
imanari-runtime = { path = "runtime" }
