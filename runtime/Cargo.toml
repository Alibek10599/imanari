[package]
name = "imanari-runtime"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
publish = false
repository = "https://github.com/Alibek10599/imanari"
description = "Runtime interface linked by generated Imanari applications"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-std", "io-util"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "postgres", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
