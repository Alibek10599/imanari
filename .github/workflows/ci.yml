name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      NARI_REQUIRE_BROWSER: 1
      NARI_REQUIRE_POSTGRES: 1
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - if: runner.os == 'macOS'
        run: ls /opt/homebrew/opt/postgresql@*/bin/initdb || brew install postgresql@16
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
